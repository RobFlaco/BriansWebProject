<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brian Robles</title>
    <link rel="stylesheet" href="styles2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <header class="header">
        <a href="#" class="logo"><span>Brian Robles</span></a>
        <ul class="navbar">
            <li><a href="#about">About</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#music">Music</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <i class="fa-solid fa-bars" id="menu-icon"></i>
        <a href="https://github.com/RobFlaco" target="_blank"><button class="visit-btn">Visit Github</button></a>
    </header>

    <!-- About section — bio filled from content.json -->
    <section id="about" class="about">
        <div class="about-container">
            <img id="bio-img" src="" alt="">
            <div class="info-box">
                <div class="text">
                    <h3 id="bio-greeting"></h3>
                    <h1 id="bio-name"></h1>
                    <span id="bio-tagline1"></span><br>
                    <span id="bio-tagline2"></span>
                </div>
                <div class="btn-group">
                    <a id="bio-resume-link" href="" download><button class="btn">Download CV</button></a>
                    <a href="#contact"><button class="btn">Contact Me</button></a>
                </div>
                <div class="socials">
                    <a id="bio-github-link" href="" target="_blank"><i class="fa-brands fa-github"></i></a>
                    <a id="bio-linkedin-link" href="" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
                </div>
            </div>
        </div>
    </section>

    <!-- Projects section — filled from content.json -->
    <section id="projects" class="projects">
        <h2 class="section-title">Projects</h2>
        <div id="projects-grid" class="projects-grid"></div>
    </section>

    <!-- Music section — filled from content.json -->
    <section id="music" class="music">
        <h2 class="section-title">Music Albums</h2>
        <div class="music-grid" id="albums-grid"></div>
    </section>

    <section id="contact" class="contact">
        <h2 class="section-title">Contact Me</h2>
        <form action="https://formsubmit.co/1b28fe0b6562207432b2db7ec2402ffb" method="POST">
            <input type="text" name="_honey" style="display:none">
            <input type="hidden" name="_captcha" value="false">
            <table>
                <tr><td><input placeholder="enter name" type="text" id="name" name="name" required></td></tr>
                <tr><td><input placeholder="enter email" type="email" id="email" name="email" required></td></tr>
                <tr><td><textarea placeholder="Type your message." id="message" name="message" rows="5" required></textarea></td></tr>
                <tr><td colspan="2"><button type="submit">Send Message</button></td></tr>
            </table>
        </form>
    </section>

    <script src="script.js"></script>
    <script>
        async function loadContent() {
            try {
                const res     = await fetch('content.json');
                const content = await res.json();
                renderBio(content.bio);
                renderProjects(content.projects);
                renderAlbums(content.albums);
            } catch(e) {
                console.error('Could not load content.json:', e);
            }
        }

        function renderBio(bio) {
            document.getElementById('bio-img').src            = bio.profileImage;
            document.getElementById('bio-greeting').textContent = bio.greeting;
            document.getElementById('bio-name').textContent    = bio.name;
            document.getElementById('bio-tagline1').textContent = bio.tagline1;
            document.getElementById('bio-tagline2').textContent = bio.tagline2;
            document.getElementById('bio-resume-link').href    = bio.resumePDF;
            document.getElementById('bio-github-link').href    = bio.github;
            document.getElementById('bio-linkedin-link').href  = bio.linkedin;
        }

        function renderProjects(projects) {
            const grid = document.getElementById('projects-grid');
            grid.innerHTML = projects.map(p => `
                <div class="project-card">
                    <img src="${p.image}" alt="">
                    <h3>${p.title}</h3>
                    <p>${p.description}</p>
                    <div class="btn-group">
                        <a href="${p.github}" target="_blank" class="btn" onclick="event.stopPropagation()">Github Repo</a>
                        <a href="${p.link}" class="btn" onclick="event.stopPropagation()">${p.title}</a>
                    </div>
                </div>
            `).join('');
            document.querySelectorAll('.project-card').forEach((card, i) => {
                card.style.cursor = 'pointer';
                card.addEventListener('click', () => window.location.href = projects[i].link);
            });
        }

        function renderAlbums(albums) {
            const grid = document.getElementById('albums-grid');
            grid.innerHTML = albums.map(a => `
                <div class="album-card">
                    <img src="${a.image}" alt="">
                    <h3>${a.title}</h3>
                    <p>${a.description}</p>
                    <div class="btn-group">
                        <a href="${a.spotify}" target="_blank" class="btn" onclick="event.stopPropagation()">Spotify</a>
                        <a href="${a.appleMusic}" target="_blank" class="btn" onclick="event.stopPropagation()">Apple Music</a>
                    </div>
                </div>
            `).join('');
            document.querySelectorAll('.album-card').forEach((card, i) => {
                card.style.cursor = 'pointer';
                card.addEventListener('click', () => window.open(albums[i].spotify, '_blank'));
            });
        }

        loadContent();
    </script>
</body>
</html>
